services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/projet-exam:cached
    command: sleep infinity

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: laravel
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data: